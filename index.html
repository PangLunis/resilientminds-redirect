<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resilient Minds Health &amp; Wellness</title>
<link rel="canonical" href="https://www.resilientmindsma.com/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://www.resilientmindsma.com/">
<script>
  // Map the OLD Wix URLs (still in Google's index) onto their real pages on the new
  // site. Previously this blindly appended window.location.pathname, so every indexed
  // old URL — /meet-jaime, /about-us, /services … — landed on a 404. Anything we don't
  // recognise now goes to the homepage rather than a dead page.
  (function () {
    var base = "https://www.resilientmindsma.com";
    var map = {
      "/meet-jaime":          "/about",
      "/about-us":            "/about",
      "/services":            "/services",
      "/insurance":           "/insurance",
      "/copy-of-fees":        "/insurance",
      "/policies-procedures": "/policies",
      "/contact":             "/#contact"
    };
    var p = (window.location.pathname || "/").replace(/\/+$/, "").toLowerCase() || "/";
    var dest = map[p] || "/";
    var hash = "";
    var hi = dest.indexOf("#");
    if (hi >= 0) { hash = dest.slice(hi); dest = dest.slice(0, hi); }
    window.location.replace(base + dest + (window.location.search || "") + hash);
  })();
</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;
       background:#f7f7f5;color:#222;text-align:center;padding:1.5rem}
  a{color:#2b6cb0}
</style>
</head>
<body>
  <div>
    <p>Resilient Minds Health &amp; Wellness has moved.</p>
    <p><a href="https://www.resilientmindsma.com/">Continue to resilientmindsma.com</a></p>
  </div>
</body>
</html>
